<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JSM Wellness Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Segoe UI;background:#f0fdf4;color:#064e3b}
header{background:#065f46;color:#fff;padding:15px;text-align:center}
nav button{margin:5px;padding:10px 18px;border:none;border-radius:20px;font-weight:700}
.page{display:none;padding:30px}
.page.active{display:block}
input,button{padding:12px;margin:6px;border-radius:12px;border:1px solid #ccc}
.admin-box{max-width:400px;margin:auto;background:#fff;padding:25px;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,.2)}
.member-card{padding:15px;margin:10px 0;border-radius:15px;background:#e0f2fe}
.logout{background:#ef4444;color:#fff}
</style>
</head>

<body>

<header>
<h1>JSM Wellness Center</h1>
<nav>
<button onclick="openPage('home')">Home</button>
<button onclick="openPage('admin')">Admin</button>
</nav>
</header>

<!-- HOME -->
<div id="home" class="page active">
<h2>Welcome to JSM Wellness Center</h2>
<p>Website working normally ✔️</p>
</div>

<!-- ADMIN -->
<div id="admin" class="page">

<!-- LOGIN -->
<div id="loginBox" class="admin-box">
<h2>Admin Login</h2>
<input id="email" placeholder="Admin Gmail">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- PANEL -->
<div id="adminPanel" class="admin-box" style="display:none">
<h2>Admin Panel</h2>

<h3>Add Member</h3>
<input id="mname" placeholder="Member Name">
<input id="mmobile" placeholder="Mobile">
<button onclick="addMember()">Add Member</button>

<div id="members"></div>

<button class="logout" onclick="logout()">Logout</button>
</div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCyAcbizqOq4V9PIjtnp-spkpQx16MBMqw",
  authDomain: "ns-fitness-website.firebaseapp.com",
  projectId: "ns-fitness-website",
  storageBucket: "ns-fitness-website.firebasestorage.app",
  messagingSenderId: "263723070366",
  appId: "1:263723070366:web:fbf3921e9b8d68c4d45c8f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// PAGE SWITCH
window.openPage = function(id){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

// LOGIN
window.login = function(){
const email = document.getElementById("email").value;
const pass = document.getElementById("pass").value;

signInWithEmailAndPassword(auth,email,pass)
.then(()=>{
document.getElementById("loginBox").style.display="none";
document.getElementById("adminPanel").style.display="block";
alert("Admin login successful");
})
.catch(e=>{
alert("Login failed: "+e.message);
});
}

// LOGOUT
window.logout = function(){
signOut(auth).then(()=>{
document.getElementById("adminPanel").style.display="none";
document.getElementById("loginBox").style.display="block";
});
}

// ADD MEMBER (demo)
window.addMember = function(){
const n = document.getElementById("mname").value;
const m = document.getElementById("mmobile").value;
if(!n || !m){ alert("Fill details"); return;}
const div=document.createElement("div");
div.className="member-card";
div.innerHTML=`<b>${n}</b><br>${m}`;
document.getElementById("members").appendChild(div);
}
</script>

</body>
</html>
